<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>동위각·엇각 시각화 훈련기</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="container">
      <header>
        <h1>중1 수학: 동위각·엇각 시각화 훈련기</h1>
        <p>핵심 3개 선분(두 기준선 + 한 횡단선)만 강조해서 각 관계를 찾는 연습을 합니다.</p>
      </header>

      <section class="card controls">
        <div class="row">
          <label for="questionType">문제 유형</label>
          <select id="questionType">
            <option value="alternate">엇각 찾기</option>
            <option value="corresponding">동위각 찾기</option>
          </select>
        </div>
        <button id="newProblemBtn" class="primary">랜덤 문제 만들기</button>
        <button id="hintBtn">핵심 선분 강조</button>
      </section>

      <section class="card board">
        <canvas id="geomCanvas" width="820" height="440"></canvas>
        <p id="questionText" class="question-text"></p>
      </section>

      <section class="card answer-panel">
        <h2>정답 입력</h2>
        <div class="row wrap">
          <label for="answerSelect">정답 각 번호</label>
          <select id="answerSelect"></select>
          <button id="checkBtn" class="secondary">채점하기</button>
          <button id="showBtn">정답 보기</button>
        </div>
        <p id="resultText" class="result"></p>
      </section>

      <section class="card examples">
        <h2>오개념 교정 포인트</h2>
        <ul>
          <li>동위각/엇각 <strong>이름 붙이기</strong>는 평행 여부와 무관합니다.</li>
          <li>하지만 <strong>두 각의 크기가 같다</strong>를 결론내리려면 평행 조건이 필요합니다.</li>
          <li>모양이 기울어지거나 선분이 많아도, “관련 3개 선분”만 잡으면 해결됩니다.</li>
        </ul>
      </section>
    </main>

    <script src="script.js"></script>
  </body>
</html>
